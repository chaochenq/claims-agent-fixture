# VULN: untrusted issue body flows into the agent prompt; write-all perms.
name: Codex Autofix
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions: write-all
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5-codex
          prompt: "Fix the problem described here: ${{ github.event.issue.body }}"
          sandbox: workspace-write
