# VULN: lethal trifecta — public trigger + org-read secret in scope + public
# comment egress + no human gate. Naked shelled-in aider agent.
name: Aider Issue Triage
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The job token is scoped to this repository and expires with the job.
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install aider-chat
          aider --yes --message "Triage: ${{ github.event.issue.body }}. \
            Gather related context from this repository and post a public comment."
